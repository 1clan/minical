<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>MINICAL — Habit Calendar</title>
<style>
  /* ============================================================
     Apple / iOS design language
     Font: SF Pro via the system font stack (real SF Pro on Apple
     devices, closest system font elsewhere).
     ============================================================ */
  :root {
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
            "Helvetica Neue", "Segoe UI", Roboto, system-ui, sans-serif;

    /* iOS light palette */
    --bg: #f2f2f7;                 /* systemGroupedBackground */
    --panel: #ffffff;              /* secondarySystemGroupedBackground */
    --ink: #000000;                /* label */
    --muted: #8e8e93;              /* secondaryLabel */
    --muted-2: #c7c7cc;            /* tertiaryLabel */
    --line: rgba(60, 60, 67, .16);
    --line-strong: rgba(60, 60, 67, .28);
    --fill: rgba(120, 120, 128, .12);
    --fill-2: rgba(120, 120, 128, .20);
    --accent: #007aff;             /* systemBlue */
    --seg-active: #ffffff;
    --material: rgba(255, 255, 255, .78);
    --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 10px 30px rgba(0, 0, 0, .06);
    --shadow-hover: 0 2px 8px rgba(0, 0, 0, .08), 0 18px 44px rgba(0, 0, 0, .10);
    --radius-card: 22px;
    --radius-widget: 22px;
    --amb1: rgba(255, 255, 255, 0);
    --amb2: rgba(255, 255, 255, 0);
    color-scheme: light;
  }

  html[data-theme="night"] {
    --bg: #000000;
    --panel: #1c1c1e;              /* secondarySystemGroupedBackground dark */
    --ink: #ffffff;
    --muted: #8e8e93;
    --muted-2: #48484a;
    --line: rgba(84, 84, 88, .60);
    --line-strong: rgba(84, 84, 88, .85);
    --fill: rgba(120, 120, 128, .24);
    --fill-2: rgba(120, 120, 128, .34);
    --accent: #0a84ff;             /* systemBlue dark */
    --seg-active: #636366;
    --material: rgba(28, 28, 30, .78);
    --shadow: 0 1px 2px rgba(0, 0, 0, .55), 0 12px 34px rgba(0, 0, 0, .55);
    --shadow-hover: 0 2px 8px rgba(0, 0, 0, .6), 0 18px 48px rgba(0, 0, 0, .65);
    --amb1: rgba(120, 150, 220, .04);
    --amb2: rgba(120, 150, 220, .03);
    color-scheme: dark;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.35;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body {
    background-image:
      radial-gradient(1100px 600px at 12% -10%, var(--amb1), transparent 60%),
      radial-gradient(900px 700px at 100% 110%, var(--amb2), transparent 55%);
    background-attachment: fixed;
    transition: background-color .3s ease, color .3s ease;
  }
  button { font-family: inherit; }

  .app { max-width: 1440px; margin: 0 auto; padding: 26px 30px 64px; }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }
  .brand { display: flex; align-items: center; gap: 13px; }
  .appicon {
    width: 47px; height: 47px;
    border-radius: 13px;
    background: #ffffff;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .16), 0 6px 16px rgba(0, 0, 0, .14);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1;
    user-select: none;
  }
  .appicon .ai-dow {
    font-size: 10px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: #ff3b30; margin-bottom: 1px;
  }
  .appicon .ai-day { font-size: 23px; font-weight: 200; color: #000; letter-spacing: -0.02em; }
  .brand h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .brand .sub { font-size: 13px; color: var(--muted); font-weight: 400; letter-spacing: 0; margin-top: 1px; }

  .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  /* iOS segmented control */
  .seg {
    display: inline-flex;
    background: var(--fill);
    border-radius: 11px;
    padding: 2px;
    gap: 2px;
  }
  .seg button {
    border: 0;
    background: transparent;
    color: var(--ink);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: -0.01em;
    padding: 6px 15px;
    border-radius: 9px;
    cursor: pointer;
    transition: background .18s ease, box-shadow .18s ease, color .18s ease;
  }
  .seg button.active {
    background: var(--seg-active);
    box-shadow: 0 1px 3px rgba(0, 0, 0, .12), 0 .5px 1px rgba(0, 0, 0, .08);
  }
  .ctrl-btn {
    width: 38px; height: 38px; border-radius: 11px;
    border: 0; background: var(--fill); color: var(--accent);
    font-size: 18px; line-height: 1; cursor: pointer;
    display: grid; place-items: center;
    transition: background .18s ease, transform .18s ease;
  }
  .ctrl-btn:hover { background: var(--fill-2); }
  .ctrl-btn:active { transform: scale(.94); }
  .ctrl-btn.on { background: var(--accent); color: #fff; }
  .size-slider { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; font-weight: 500; letter-spacing: -0.01em; }
  .size-slider input[type="range"] { width: 104px; accent-color: var(--accent); cursor: pointer; }
  .seg-group { display: inline-flex; align-items: center; gap: 6px; }

  /* ---------- layout ---------- */
  .content {
    display: grid;
    grid-template-columns: 236px 1fr;
    gap: 22px;
    align-items: start;
  }

  /* ---------- rail ---------- */
  .rail {
    background: var(--panel);
    border-radius: var(--radius-card);
    padding: 18px 14px 16px;
    box-shadow: var(--shadow);
    position: sticky;
    top: 18px;
  }
  .rail-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4px;
    margin-bottom: 12px;
  }
  .rail-head h2 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink);
    text-transform: none;
  }
  .icon-btn {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 0;
    background: var(--fill);
    color: var(--accent);
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: background .18s ease, transform .18s ease;
  }
  .icon-btn:hover { background: var(--fill-2); }
  .icon-btn:active { transform: scale(.94); }

  .habit-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }

  .habit {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 10px;
    border-radius: 12px;
    transition: background .16s ease;
  }
  .habit:hover { background: var(--fill); }
  .habit .swatch {
    width: 26px; height: 26px;
    border-radius: 8px;
    background: var(--c);
    flex: none;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .12);
  }
  .habit .name {
    flex: 1;
    font-size: 15px;
    font-weight: 400;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .habit .right { display: flex; align-items: center; gap: 7px; flex: none; }
  .habit .count {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  .habit .streak {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    padding: 2px 7px 3px;
    border-radius: 8px;
    background: var(--fill);
    display: none;
  }
  .habit .streak.on { display: inline-block; }
  .habit .streak.bump { animation: streakBump .55s cubic-bezier(.2, .9, .25, 1); }
  .habit .streak.on { animation: streakPulse 3s ease-in-out infinite; }
  .habit .streak.on.bump { animation: streakBump .55s cubic-bezier(.2, .9, .25, 1), streakPulse 3s ease-in-out infinite; }
  .habit .del {
    border: 0; background: transparent; color: var(--muted);
    font-size: 17px; cursor: pointer; line-height: 1;
    padding: 2px 4px; border-radius: 7px;
    opacity: 0; transition: opacity .15s ease, color .15s ease;
  }
  .habit:hover .del { opacity: 1; }
  .habit .del:hover { color: #ff3b30; }

  /* add form */
  .add-form {
    margin-top: 12px;
    padding: 12px 4px 0;
    border-top: .5px solid var(--line);
    display: none;
    flex-direction: column;
    gap: 10px;
  }
  .add-form.open { display: flex; }
  .add-form input {
    font-family: inherit;
    font-size: 15px;
    padding: 11px 13px;
    border-radius: 11px;
    border: 0;
    background: var(--fill);
    color: var(--ink);
    outline: none;
    width: 100%;
    letter-spacing: -0.01em;
  }
  .add-form input::placeholder { color: var(--muted); }
  .add-form input:focus { box-shadow: 0 0 0 3.5px rgba(0, 122, 255, .28); }
  .palette { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px; }
  .palette button {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer; padding: 0;
    transition: transform .12s ease;
  }
  .palette button:hover { transform: scale(1.12); }
  .palette button.sel { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px currentColor; }
  .add-form .go {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    padding: 11px 0;
    border-radius: 12px;
    border: 0;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: filter .16s ease;
  }
  .add-form .go:hover { filter: brightness(1.06); }
  .add-form .go:active { filter: brightness(.94); }
  .add-form .seg-sm { align-self: flex-start; }
  .add-form .seg-sm button { padding: 7px 14px; font-size: 13px; }
  .add-form .target-row {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; font-weight: 500; color: var(--muted);
    letter-spacing: -0.01em;
  }
  .add-form .target-row input {
    width: 84px; padding: 8px 11px; font-size: 14px; text-align: center;
  }

  .rail-foot {
    margin-top: 14px;
    padding-top: 14px;
    border-top: .5px solid var(--line);
    display: flex;
    gap: 8px;
  }
  .rail-foot button {
    flex: 1;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -0.01em;
    padding: 9px 0;
    border-radius: 11px;
    border: 0;
    background: var(--fill);
    color: var(--accent);
    cursor: pointer;
    transition: background .16s ease;
  }
  .rail-foot button:hover { background: var(--fill-2); }

  /* ---------- stage ---------- */
  .stage { padding: 4px 2px 0; }
  .stage-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    padding: 0 6px;
  }
  .stage-head .period {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 4px;
    min-width: 200px;
  }
  .nav-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 0;
    background: var(--fill);
    color: var(--accent);
    font-size: 20px;
    font-weight: 500;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: background .16s ease, transform .12s ease;
    flex: none;
    padding-bottom: 2px;
  }
  .nav-btn:hover { background: var(--fill-2); }
  .nav-btn:active { transform: scale(.92); }
  .today-btn {
    margin-left: auto;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: -0.01em;
    padding: 8px 17px;
    border-radius: 999px;
    border: 0;
    background: var(--fill);
    color: var(--accent);
    cursor: pointer;
    transition: background .16s ease;
  }
  .today-btn:hover { background: var(--fill-2); }

  /* ---------- month: each day is an iOS widget ---------- */
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }

  .day {
    position: relative;
    min-height: var(--daymin, 118px);
    border-radius: var(--radius-widget);
    background: var(--panel);
    box-shadow: var(--shadow);
    padding: 11px 12px 14px;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    overflow: hidden;
    isolation: isolate;
    transition: transform .2s cubic-bezier(.2, .8, .2, 1), box-shadow .2s ease;
  }
  .day:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
  .day:active { transform: translateY(-1px) scale(.995); }

  .day.out { background: transparent; box-shadow: none; opacity: .45; }
  .day.out:hover { transform: none; box-shadow: none; opacity: .7; }

  .day.today { box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
  .day.today .w-date { color: var(--accent); }

  .w-top { display: flex; align-items: center; justify-content: space-between; }
  .w-dow {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .note-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    opacity: 0;
    transition: opacity .15s ease;
  }
  .day.has-note .note-dot { opacity: 1; }

  .w-date {
    font-size: calc(var(--daymin, 118px) * 0.254);
    font-weight: 200;
    letter-spacing: -0.02em;
    line-height: 1;
    margin-top: 2px;
    transition: color .25s ease;
  }
  .day.perfect .w-date { font-weight: 300; }

  /* real ukiyo-e artwork, one per day, transparency by completion */
  .w-top, .w-date, .dots { position: relative; z-index: 1; }
  .art {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-repeat: no-repeat;
    background-position: 50% 50%;
    pointer-events: none;
    z-index: 0;
    opacity: var(--artop, .6);
    -webkit-mask-image: linear-gradient(180deg, rgba(0, 0, 0, .55) 0%, #000 26%);
    mask-image: linear-gradient(180deg, rgba(0, 0, 0, .55) 0%, #000 26%);
    transition: opacity .5s ease, transform .5s cubic-bezier(.2, .8, .2, 1);
    transform: scale(1.02);
    will-change: transform, opacity;
  }
  .day:hover .art { transform: scale(1.07); }
  .day.out .art { opacity: .22; transform: none; }
  .no-art .art { display: none; }
  .art.photo {
    -webkit-mask-image: none;
    mask-image: none;
    transform: none;
  }
  .day:hover .art.photo { transform: scale(1.04); }
  .day.has-photo .w-date, .day.has-photo .w-dow { text-shadow: 0 1px 4px rgba(255, 255, 255, .95), 0 1px 2px rgba(255, 255, 255, .9); }
  html[data-theme="night"] .day.has-photo .w-date, html[data-theme="night"] .day.has-photo .w-dow { text-shadow: 0 1px 4px rgba(0, 0, 0, .95), 0 1px 2px rgba(0, 0, 0, .9); }
  .w-date, .w-dow { text-shadow: 0 1px 2px rgba(255, 255, 255, .5); }
  html[data-theme="night"] .w-date, html[data-theme="night"] .w-dow { text-shadow: 0 1px 3px rgba(0, 0, 0, .65); }

  .dots {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: auto;
    padding-top: 8px;
  }
  .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    border: 1.5px solid var(--line-strong);
    background: transparent;
    padding: 0;
    cursor: pointer;
    transition: transform .14s cubic-bezier(.2, .8, .2, 1), background .14s ease, border-color .14s ease;
  }
  .dot:hover { transform: scale(1.35); }
  .dot.done { background: var(--c); border-color: var(--c); }
  .dot.count {
    width: auto; min-width: 17px; height: 17px;
    padding: 0 3px;
    border-radius: 6px;
    display: inline-grid; place-items: center;
    font-size: 9.5px; font-weight: 600; line-height: 1;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    transition: transform .14s cubic-bezier(.2, .8, .2, 1), background .14s ease, border-color .14s ease, color .14s ease;
  }
  .dot.count.partial { border-color: var(--c); color: var(--c); background: var(--fill); }
  .dot.count.done { background: var(--c); border-color: var(--c); color: #fff; }
  .day.out .dot { border-color: var(--line); }
  .dot.pop { animation: dotPop .42s cubic-bezier(.2, .9, .25, 1); }

  /* ---------- week ---------- */
  .week-card {
    background: var(--panel);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow);
    padding: 18px 8px 10px;
  }
  .week-head {
    display: grid;
    grid-template-columns: 104px repeat(7, 1fr) 46px;
    align-items: end;
    gap: 4px;
    padding: 0 12px 12px;
    margin-bottom: 2px;
  }
  .week-head .wh-day {
    text-align: center;
    font-size: 11px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }
  .week-head .wh-day b {
    display: block; font-size: 19px; font-weight: 300;
    color: var(--ink); margin-top: 4px; letter-spacing: -0.02em;
  }
  .week-head .wh-day.today, .week-head .wh-day.today b { color: var(--accent); }
  .week-head .wh-day[data-day] { cursor: pointer; }
  .week-head .wh-day[data-day]:hover b { text-decoration: underline; }
  .week-head .wh-day.has-note::after {
    content: ""; display: block; width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent); margin: 5px auto 0;
  }

  .week-rows { position: relative; }
  .line-row {
    position: relative;
    display: grid;
    grid-template-columns: 104px 1fr 46px;
    align-items: center;
    gap: 4px;
    padding: 10px 12px;
    transition: background .16s ease;
  }
  .line-row + .line-row::before {
    content: ""; position: absolute; left: 24px; right: 24px; top: 0;
    height: .5px; background: var(--line);
  }
  .line-row:hover { background: var(--fill); }
  .line-row .lname {
    display: flex; align-items: center; gap: 9px;
    font-size: 14px;
    font-weight: 400;
    letter-spacing: -0.01em;
    padding-right: 10px;
    white-space: nowrap;
    overflow: hidden;
  }
  .line-row .ldot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--c); }
  .line-row .lname > span:last-child { overflow: hidden; text-overflow: ellipsis; }
  .line-track {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 28px;
    padding: 0 3px;
  }
  .line-stroke {
    position: absolute;
    left: 11px; right: 11px;
    top: 50%;
    transform: translateY(-50%);
    height: 4px;
    border-radius: 3px;
    background: var(--c);
    opacity: .85;
  }
  .today-guide {
    position: absolute;
    top: -13px; bottom: -13px;
    width: 2px;
    border-radius: 2px;
    background: var(--accent);
    opacity: .22;
    transform: translateX(-50%);
    left: calc(11px + (100% - 22px) * var(--i) / 6);
    pointer-events: none;
    z-index: 0;
  }
  .station {
    position: relative;
    z-index: 1;
    width: 17px; height: 17px;
    border-radius: 50%;
    border: 2.5px solid var(--c);
    background: var(--panel);
    cursor: pointer;
    padding: 0;
    transition: background .18s ease, transform .18s cubic-bezier(.2, .8, .2, 1);
  }
  .line-row:hover .station { transform: scale(1.06); }
  .station:hover { transform: scale(1.3) !important; }
  .station.done { background: var(--c); }
  .station.pop { animation: dotPop .42s cubic-bezier(.2, .9, .25, 1); }
  .station.count {
    width: auto; min-width: 17px; height: 17px; padding: 0 2px;
    border-radius: 6px;
    display: inline-grid; place-items: center;
    font-size: 9px; font-weight: 600; line-height: 1;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .station.count.partial { color: var(--c); background: var(--panel); }
  .station.count.done { color: #fff; }
  .line-row .lcount {
    text-align: right;
    font-size: 13px;
    font-weight: 400;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- page 2: writing planner ---------- */
  #pageToggle button, #linesToggle button { min-width: 34px; padding: 6px 11px; text-align: center; }

  .planner {
    background: var(--panel);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow);
    padding: 16px;
  }
  .planner-head {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    margin-bottom: 8px;
  }
  .planner-head .phead {
    text-align: center;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .planner-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .pbox {
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    border: .5px solid var(--line);
    border-radius: 14px;

  .d-habit .stepper { display: flex; align-items: center; gap: 4px; flex: none; }

    width: 30px; height: 30px; border-radius: 50%;

  }
  .d-habit .stepper button:hover { background: var(--line); }
  .d-habit .stepper button:active { transform: scale(.9); }
  .d-habit .stepper b {
    min-width: 26px; text-align: center;
    font-size: 16px; font-weight: 600; color: var(--c);
    font-variant-numeric: tabular-nums;
  }
  .d-art { display: flex; flex-direction: column; gap: 9px; }
  .d-art-label {
    font-size: 13px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--muted);
  }
  .d-art-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .d-art-actions button {
    font-family: inherit; font-size: 13px; font-weight: 500;
    letter-spacing: -0.01em; color: var(--accent);
    border: 0; background: var(--fill); padding: 9px 15px;
    border-radius: 10px; cursor: pointer;

  }
  .d-art-actions button:hover { background: var(--fill-2); }
  .d-thumb {
    width: 100%; height: 92px; border-radius: 12px;
    background-size: cover; background-position: 50% 50%;
    background-color: var(--fill);
  }

  .d-note-label {
    font-size: 13px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--muted);
  }
  .d-note {
    width: 100%; min-height: 150px; resize: vertical;
    font-family: inherit; font-size: 15px; line-height: 1.55;
    letter-spacing: -0.01em;
    padding: 13px 14px; border-radius: 14px;
    border: 0;
    background: var(--fill);
    color: var(--ink); outline: none;
  }
  .d-note::placeholder { color: var(--muted); }
  .d-note:focus { box-shadow: 0 0 0 3.5px rgba(0, 122, 255, .28); }

  .d-meta {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; color: var(--muted); font-weight: 400;
    letter-spacing: -0.01em;
  }
  .d-meta button {
    border: 0; background: transparent; color: var(--accent);
    font-family: inherit; font-size: 13px; font-weight: 500;
    cursor: pointer; padding: 5px 8px; border-radius: 8px;
  }
  .d-meta button:hover { background: var(--fill); }

  /* ---------- night: ambient glow on colorful marks ---------- */
  html[data-theme="night"] .line-stroke { box-shadow: 0 0 12px -2px var(--c); }
  html[data-theme="night"] .station { box-shadow: 0 0 9px -1px var(--c); }
  html[data-theme="night"] .station.done { box-shadow: 0 0 12px 0 var(--c); }
  html[data-theme="night"] .dot.done { box-shadow: 0 0 8px -1px var(--c); }
  html[data-theme="night"] .habit .swatch,
  html[data-theme="night"] .d-habit .swatch { box-shadow: 0 0 10px -2px var(--c); }
  html[data-theme="night"] .scrim { background: rgba(0, 0, 0, .5); }

  /* ---------- animations ---------- */
  @keyframes dotPop {
    0% { transform: scale(.35); }
    62% { transform: scale(1.28); }
    100% { transform: scale(1); }
  }
  @keyframes streakBump {
    0% { transform: scale(.7); opacity: .15; }
    55% { transform: scale(1.22); }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes streakPulse {
    0%, 100% { opacity: .7; }
    50% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }

  @media (max-width: 900px) {
    .content { grid-template-columns: 1fr; }
    .rail { position: static; }
    .stage-head .period { font-size: 20px; min-width: 0; }
    .grid { gap: 8px; }
    .day { border-radius: 18px; padding: 9px 10px 11px; }
    .week-card { padding: 14px 4px 8px; }

    .planner-grid, .planner-head { gap: 5px; }

    .pwrite { font-size: 12px; }
  }

  function hash(str) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;

  function artFor(seed, ratio, isToday) {
    var h = hash(seed);
    var uri = ART[h % ART.length];
    var x = 42 + (hash(seed + "|x") % 17);
    var y = 44 + (hash(seed + "|y") % 13);
    var op = 0.6 + Math.min(1, ratio) * 0.32 + (isToday ? 0.1 : 0);
    if (op > 0.96) op = 0.96;
    return { uri: uri, pos: x + "% " + y + "%", op: op };
  }

    s.daySize = Math.max(68, Math.min(220, Math.round(Number(s.daySize) || (window.innerWidth <= 900 ? 92 : 118))));
    s.habits.forEach(function (h) {
      if (h.type !== "count") h.type = "check";
      h.target = h.type === "count" ? Math.max(1, Math.min(999, Math.round(Number(h.target) || 1))) : 1;
    });
    return s;
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORE);
      if (!raw) return normalize(seed());
      var s = JSON.parse(raw);
      if (!s || !Array.isArray(s.habits)) return normalize(seed());
      var MAP = { "#e5503e": "#ff3b30", "#f4a03c": "#ff9500", "#f2cf4a": "#ffcc00", "#5fb85f": "#34c759", "#3ba99c": "#30b0c7", "#4a90d9": "#007aff", "#8e6bbf": "#af52de", "#e07a9a": "#ff2d55", "#c96f5a": "#ff9500", "#7d8fa8": "#8e8e93" };
      s.habits.forEach(function (h) { if (MAP[h.color]) h.color = MAP[h.color]; });
      return normalize(s);
    } catch (e) { return normalize(seed()); }
  }

  var state = load();
  var addColor = PALETTE[state.habits.length % PALETTE.length];
  var addType = "check";
  var pendingPop = null;
  var lastStreak = {};

  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(state)); return true; }
    catch (e) { return false; }
  }

  function applySize() {
    document.documentElement.style.setProperty("--daymin", state.daySize + "px");
  }

  function applyArt() {
    document.documentElement.classList.toggle("no-art", !state.artOn);
  }

  function readImage(file, cb) {
    var reader = new FileReader();
    reader.onload = function () {
      var im = new Image();
      im.onload = function () {
        var max = 640;
        var w = im.width, h = im.height;
        var k = Math.min(1, max / Math.max(w, h));
        w = Math.max(1, Math.round(w * k)); h = Math.max(1, Math.round(h * k));
        var c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(im, 0, 0, w, h);
        var uri;
        try { uri = c.toDataURL("image/jpeg", 0.72); } catch (e) { uri = reader.result; }
        cb(uri);
      };
      im.onerror = function () { cb(null); };
      im.src = reader.result;
    };
    reader.onerror = function () { cb(null); };
    reader.readAsDataURL(file);
  }

  function getHabit(id) {
    for (var i = 0; i < state.habits.length; i++) if (state.habits[i].id === id) return state.habits[i];
    return null;
  }

  function countValue(dateIso, h) {
    var d = state.values[dateIso];
    return (d && d[h.id]) || 0;
  }

  function isHabitDone(h, dateIso) {
    if (h.type === "count") return countValue(dateIso, h) >= h.target;
    var a = state.log[dateIso];
    return !!(a && a.indexOf(h.id) !== -1);
  }

  function setCount(dateIso, h, v) {
    if (!state.values[dateIso]) state.values[dateIso] = {};
    if (v > 0) state.values[dateIso][h.id] = v; else delete state.values[dateIso][h.id];
    if (!Object.keys(state.values[dateIso]).length) delete state.values[dateIso];
  }

  function bumpCount(dateIso, h, dir) {
    var v = countValue(dateIso, h) + dir;
    if (v > h.target) v = 0;
    if (v < 0) v = h.target;
    setCount(dateIso, h, v);
  }

  function stepCount(dateIso, h, dir) {
    var v = countValue(dateIso, h) + dir;
    if (v < 0) v = 0;
    if (v > h.target) v = h.target;
    setCount(dateIso, h, v);
  }

  function toggle(habitId, dateIso) {
    var h = getHabit(habitId);
    if (!h) return;
    if (h.type === "count") {
      bumpCount(dateIso, h, 1);
    } else {
      var a = state.log[dateIso];
      if (!a) { a = state.log[dateIso] = []; }
      var i = a.indexOf(habitId);
      if (i >= 0) a.splice(i, 1); else a.push(habitId);
      if (!a.length) delete state.log[dateIso];
    }
    save();
    pendingPop = { habit: habitId, date: dateIso };
    render();
    pendingPop = null;
  }

  /* ---------- streaks & stats ---------- */
  function doneSet(habitId) {
    var h = getHabit(habitId);
    var set = {};
    if (!h) return set;
    Object.keys(state.log).forEach(function (k) {
      if (h.type !== "count" && state.log[k].indexOf(h.id) !== -1) set[k] = 1;
    });
    Object.keys(state.values).forEach(function (k) {
      if (h.type === "count" && (state.values[k][h.id] || 0) >= h.target) set[k] = 1;
    });
    return set;
  }

  function currentStreak(habitId) {
    var set = doneSet(habitId);
    var d = new Date(); d.setHours(0, 0, 0, 0);
    if (!set[iso(d)]) d = addDays(d, -1);
    var n = 0;
    while (set[iso(d)]) { n++; d = addDays(d, -1); }
    return n;
  }

  function bestStreak(habitId) {
    var keys = Object.keys(doneSet(habitId)).sort();
    var best = 0, run = 0, prev = null;
    keys.forEach(function (k) {
      run = (prev && iso(addDays(prev, 1)) === k) ? run + 1 : 1;
      if (run > best) best = run;
      prev = fromISO(k);
    });
    return best;
  }

  function monthStats() {
    var a = fromISO(state.anchor);
    var y = a.getFullYear(), m = a.getMonth();
    var nDays = new Date(y, m + 1, 0).getDate();
    var total = state.habits.length;
    var checkins = 0, perfect = 0, topStreak = 0, topName = null;
    var perDay = [];
    for (var i = 1; i <= nDays; i++) {
      var ds = iso(new Date(y, m, i));
      var done = 0;
      state.habits.forEach(function (h) { if (isHabitDone(h, ds)) done++; });
      checkins += done;
      if (total > 0 && done === total) perfect++;
      perDay.push({ date: ds, ratio: total ? done / total : 0 });
    }
    state.habits.forEach(function (h) {
      var s = currentStreak(h.id);
      if (s > topStreak) { topStreak = s; topName = h.name; }
    });
    return {
      checkins: checkins,
      perfect: perfect,
      rate: (nDays * total) ? Math.round(checkins / (nDays * total) * 100) : 0,
      topStreak: topStreak,
      topName: topName,
      perDay: perDay
    };
  }

  var HEAT = ["#ffd60a", "#ff9f0a", "#ff7a00", "#ff3b30"];
  function heatColor(ratio) {
    if (ratio <= 0) return "";
    var idx = Math.min(HEAT.length - 1, Math.floor(ratio * HEAT.length - 1e-6));
    return HEAT[idx];
  }

  function renderStats() {
    var host = document.getElementById("stats");
    host.innerHTML = "";
    var st = monthStats();
    var a = fromISO(state.anchor);
    var monthName = a.toLocaleString(undefined, { month: "long" });

    var head = el("div", "stats-head");
    head.appendChild(el("h3", null, esc(monthName) + " heat"));
    var scale = el("div", "scale", "Less");
    scale.appendChild(el("i"));
    for (var i = 0; i < HEAT.length; i++) {
      var sw = el("i");
      sw.style.background = HEAT[i];
      scale.appendChild(sw);
    }
    scale.appendChild(document.createTextNode("More"));
    head.appendChild(scale);
    host.appendChild(head);

    var row = el("div", "stats-row");
    function stat(value, label) {
      var s = el("div", "stat");
      s.appendChild(el("b", null, value));
      s.appendChild(el("span", null, label));
      return s;
    }
    row.appendChild(stat(String(st.checkins), "check-ins"));
    row.appendChild(stat(String(st.perfect), "perfect days"));
    row.appendChild(stat(st.rate + "<em>%</em>", "completion"));
    row.appendChild(stat(st.topStreak > 0 ? st.topStreak + "<em>d</em>" : "—", st.topName ? "best · " + esc(st.topName) : "top streak"));
    host.appendChild(row);

    if (!state.habits.length) return;

    var heat = el("div", "heat");
    WEEKDAYS.forEach(function (w) { heat.appendChild(el("div", "hl", w[0])); });
    var lead = ((new Date(a.getFullYear(), a.getMonth(), 1).getDay() + 6) % 7);
    for (var b = 0; b < lead; b++) heat.appendChild(el("div", "hc blank"));
    var today = new Date();
    st.perDay.forEach(function (p) {
      var cell = el("div", "hc f" + (sameDay(fromISO(p.date), today) ? " today" : ""));
      var c = heatColor(p.ratio);
      if (c) cell.style.background = c;
      cell.title = p.date + " — " + Math.round(p.ratio * 100) + "%";
      heat.appendChild(cell);
    });
    host.appendChild(heat);
  }

  /* ---------- period bounds ---------- */
  function periodDays() {
    var anchor = fromISO(state.anchor);
    var days = [];
    if (state.view === "month" || state.page === 2) {
      var first = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
      var start = startOfWeek(first);
      var last = new Date(anchor.getFullYear(), anchor.getMonth() + 1, 0);
      var end = addDays(startOfWeek(last), 6);
      for (var d = new Date(start); d <= end; d = addDays(d, 1)) days.push(new Date(d));
    } else {
      var s = startOfWeek(anchor);
      for (var i = 0; i < 7; i++) days.push(addDays(s, i));
    }
    return days;
  }

  function periodLabel() {
    var a = fromISO(state.anchor);
    if (state.view === "month" || state.page === 2) {
      return a.toLocaleString(undefined, { month: "long", year: "numeric" });
    }
    var s = startOfWeek(a), e = addDays(s, 6);
    var opt = { month: "short", day: "numeric" };
    var left = s.toLocaleString(undefined, opt);
    var right = e.toLocaleString(undefined, Object.assign({}, opt, { year: "numeric" }));
    return left + " – " + right;
  }

  /* ---------- rail ---------- */
  function renderRail() {
    var list = document.getElementById("habitList");
    list.innerHTML = "";
    if (!state.habits.length) {
      list.appendChild(el("li", "empty", "No habits yet."));
      return;
    }
    var days = periodDays();
    var daySet = days.map(iso);
    state.habits.forEach(function (h) {
      var count = 0;
      daySet.forEach(function (ds) { if (isHabitDone(h, ds)) count++; });
      var cur = currentStreak(h.id);
      var best = bestStreak(h.id);
      var bump = lastStreak[h.id] !== undefined && cur > lastStreak[h.id];
      lastStreak[h.id] = cur;
      var li = el("li", "habit");
      li.innerHTML =
        '<span class="swatch" style="--c:' + h.color + ';background:' + h.color + '"></span>' +
        '<span class="name">' + esc(h.name) + '</span>' +
        '<span class="right">' +
          '<span class="streak' + (cur > 0 ? " on" : "") + (bump ? " bump" : "") + '" style="color:' + h.color + '" ' +
            'title="Current streak ' + cur + 'd · best ' + best + 'd">' + cur + "d</span>" +
          '<span class="count">' + count + "/" + days.length + "</span>" +
        "</span>" +
        '<button class="del" title="Delete habit" data-del="' + h.id + '">×</button>';
      list.appendChild(li);
    });
  }

  /* ---------- month view: day = iOS widget ---------- */
  function renderMonth(host) {
    var anchor = fromISO(state.anchor);
    var first = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
    var start = startOfWeek(first);
    var daysInMonth = new Date(anchor.getFullYear(), anchor.getMonth() + 1, 0).getDate();
    var totalCells = ((first.getDay() + 6) % 7) + daysInMonth;
    var rows = Math.ceil(totalCells / 7);
    var today = new Date();
    var total = state.habits.length;

    var grid = el("div", "grid");
    for (var i = 0; i < rows * 7; i++) {
      var d = addDays(start, i);
      var ds = iso(d);
      var out = d.getMonth() !== anchor.getMonth();
      var done = 0;
      state.habits.forEach(function (h) { if (isHabitDone(h, ds)) done++; });
      var ratio = total ? done / total : 0;
      var photo = state.images[ds] || state.customArt || null;
      var cls = "day" + (out ? " out" : "") + (sameDay(d, today) ? " today" : "");
      if (state.notes[ds]) cls += " has-note";
      if (total && done === total) cls += " perfect";
      if (photo) cls += " has-photo";

      var cell = el("div", cls);
      cell.dataset.day = ds;
      var isToday = sameDay(d, today);
      var art = el("div", "art");
      if (photo) {
        art.classList.add("photo");
        art.style.backgroundImage = 'url("' + photo + '")';
        art.style.backgroundPosition = "50% 50%";
        art.style.setProperty("--artop", "1");
      } else {
        var a = artFor(ds, ratio, isToday);
        art.style.backgroundImage = 'url("' + a.uri + '")';
        art.style.backgroundPosition = a.pos;
        art.style.setProperty("--artop", a.op.toFixed(3));
      }
      art.setAttribute("aria-hidden", "true");
      cell.appendChild(art);

      var top = el("div", "w-top");
      top.appendChild(el("span", "w-dow", WEEKDAYS[(d.getDay() + 6) % 7].slice(0, 3)));
      top.appendChild(el("span", "note-dot"));
      cell.appendChild(top);

      cell.appendChild(el("div", "w-date", String(d.getDate())));

      var dots = el("div", "dots");
      state.habits.forEach(function (h) {
        var isP = pendingPop && pendingPop.habit === h.id && pendingPop.date === ds;
        var b;
        if (h.type === "count") {
          var v = countValue(ds, h);
          var done = v >= h.target;
          var cls = "dot count" + (done ? " done" : (v > 0 ? " partial" : "")) + (isP ? " pop" : "");
          b = el("button", cls, v ? String(v) : "");
          b.style.setProperty("--c", h.color);
          b.title = h.name + " — " + v + "/" + h.target;
        } else {
          var dn = isHabitDone(h, ds);
          b = el("button", "dot" + (dn ? " done" : "") + (isP ? " pop" : ""));
          b.style.setProperty("--c", h.color);
          b.title = h.name;
        }
        b.dataset.habit = h.id;
        b.dataset.date = ds;
        dots.appendChild(b);
      });
      cell.appendChild(dots);

      grid.appendChild(cell);
    }
    host.appendChild(grid);
  }

  /* ---------- week view ---------- */
  function renderWeek(host) {
    var anchor = fromISO(state.anchor);
    var s = startOfWeek(anchor);
    var today = new Date();
    var todayIdx = -1;

    var card = el("div", "week-card");

    var head = el("div", "week-head");
    head.appendChild(el("div", "wh-day", ""));
    for (var i = 0; i < 7; i++) {
      var d = addDays(s, i);
      var ds = iso(d);
      if (sameDay(d, today)) todayIdx = i;
      var cls = "wh-day" + (sameDay(d, today) ? " today" : "");
      var hd = el("div", cls, WEEKDAYS[i] + "<b>" + d.getDate() + "</b>");
      hd.dataset.day = ds;
      if (state.notes[ds]) hd.classList.add("has-note");
      head.appendChild(hd);
    }
    head.appendChild(el("div", "wh-day", ""));
    card.appendChild(head);

    if (!state.habits.length) {
      card.appendChild(el("div", "empty", "Add a habit to start tracking."));
      host.appendChild(card);
      return;
    }

    var rows = el("div", "week-rows");
    state.habits.forEach(function (h) {
      var row = el("div", "line-row");
      row.style.setProperty("--c", h.color);

      var name = el("div", "lname");
      var ld = el("span", "ldot");
      ld.style.background = h.color;
      name.appendChild(ld);
      name.appendChild(el("span", null, esc(h.name)));
      row.appendChild(name);

      var track = el("div", "line-track");
      track.appendChild(el("div", "line-stroke"));
      if (todayIdx >= 0) {
        var guide = el("div", "today-guide");
        guide.style.setProperty("--i", String(todayIdx));
        track.appendChild(guide);
      }
      var count = 0;
      for (var j = 0; j < 7; j++) {
        var ds = iso(addDays(s, j));
        var done = isHabitDone(h, ds);
        if (done) count++;
        var isP = pendingPop && pendingPop.habit === h.id && pendingPop.date === ds;
        var st;
        if (h.type === "count") {
          var v = countValue(ds, h);
          st = el("button", "station count" + (done ? " done" : (v > 0 ? " partial" : "")) + (isP ? " pop" : ""), v ? String(v) : "");
          st.style.setProperty("--c", h.color);
          st.title = h.name + " — " + v + "/" + h.target;
        } else {
          st = el("button", "station" + (done ? " done" : "") + (isP ? " pop" : ""));
          st.title = h.name + " — " + ds;
        }
        st.dataset.habit = h.id;
        st.dataset.date = ds;
        track.appendChild(st);
      }
      row.appendChild(track);
      row.appendChild(el("div", "lcount", count + "/7"));
      rows.appendChild(row);
    });
    card.appendChild(rows);
    host.appendChild(card);
  }

  /* ---------- page 2: writing planner ---------- */
  function renderPlanner(host) {
    var anchor = fromISO(state.anchor);
    var first = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
    var start = startOfWeek(first);
    var daysInMonth = new Date(anchor.getFullYear(), anchor.getMonth() + 1, 0).getDate();
    var totalCells = ((first.getDay() + 6) % 7) + daysInMonth;
    var rows = Math.ceil(totalCells / 7);
    var today = new Date();

    var wrap = el("div", "planner");

    var head = el("div", "planner-head");
    WEEKDAYS.forEach(function (w) { head.appendChild(el("div", "phead", w)); });
    wrap.appendChild(head);

    var grid = el("div", "planner-grid");
    for (var i = 0; i < rows * 7; i++) {
      var d = addDays(start, i);
      var ds = iso(d);
      var out = d.getMonth() !== anchor.getMonth();
      var cls = "pbox" + (out ? " out" : "") + (sameDay(d, today) ? " today" : "");
      var box = el("div", cls);

      var h = el("div", "pbox-head");
      h.appendChild(el("span", "pdow", WEEKDAYS[(d.getDay() + 6) % 7].slice(0, 3)));
      h.appendChild(el("span", "pnum", String(d.getDate())));
      box.appendChild(h);

      var ta = el("textarea", "pwrite");
      ta.dataset.write = ds;
      ta.setAttribute("spellcheck", "false");
      ta.setAttribute("aria-label", "Notes for " + ds);
      ta.style.setProperty("--lines", String(state.lines));
      ta.value = state.writing[ds] || "";
      box.appendChild(ta);

      grid.appendChild(box);
    }
    wrap.appendChild(grid);
    host.appendChild(wrap);
  }

  /* ---------- render ---------- */
  var mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  function resolvedTheme() {
    if (state.theme === "auto") return (mq && mq.matches) ? "night" : "day";
    return state.theme;
  }
  function applyTheme() {
    document.documentElement.dataset.theme = resolvedTheme();
    document.querySelectorAll("#themeToggle button").forEach(function (b) {
      b.classList.toggle("active", b.dataset.theme === state.theme);
    });
  }

  function render() {
    flushWrites();
    applyTheme();
    applySize();
    applyArt();
    document.getElementById("artBtn").classList.toggle("on", state.artOn);
    document.getElementById("imgClear").style.display = state.customArt ? "" : "none";
    document.getElementById("imgBtn").classList.toggle("on", !!state.customArt);
    document.getElementById("sizeRange").parentNode.style.display = (state.page === 1 && state.view === "month") ? "" : "none";
    document.querySelectorAll("#pageToggle button").forEach(function (b) {
      b.classList.toggle("active", Number(b.dataset.page) === state.page);
    });
    document.querySelectorAll("#viewToggle button").forEach(function (b) {
      b.classList.toggle("active", b.dataset.view === state.view);
    });
    document.querySelectorAll("#linesToggle button").forEach(function (b) {
      b.classList.toggle("active", Number(b.dataset.lines) === state.lines);
    });
    document.getElementById("viewToggle").style.display = state.page === 2 ? "none" : "";
    document.getElementById("linesToggle").style.display = state.page === 2 ? "" : "none";
    document.getElementById("periodLabel").textContent = periodLabel();

    var host = document.getElementById("calendar");
    host.innerHTML = "";
    var statsHost = document.getElementById("stats");
    if (state.page === 2) {
      renderPlanner(host);
      statsHost.innerHTML = "";
    } else {
      if (state.view === "month") renderMonth(host);
      else renderWeek(host);
      renderStats();
    }

    renderRail();
    if (openDate) { renderDrawerHabits(); renderDrawerArt(); updateDrawerMeta(); }
  }

  /* ---------- day drawer ---------- */
  var openDate = null;

  function renderDrawerArt() {
    var thumb = document.getElementById("dArtThumb");
    var img = state.images[openDate] || state.customArt || null;
    if (img) {
      thumb.style.backgroundImage = 'url("' + img + '")';
      thumb.style.display = "";
    } else {
      thumb.style.backgroundImage = "";
      var a = artFor(openDate, 0, false);
      thumb.style.backgroundImage = 'url("' + a.uri + '")';
      thumb.style.display = "";
    }
    document.getElementById("dArtClear").style.display = state.images[openDate] ? "" : "none";
  }

  function openDrawer(dateIso) {
    openDate = dateIso;
    var d = fromISO(dateIso);
    document.getElementById("dWeekday").textContent = d.toLocaleString(undefined, { weekday: "long" });
    document.getElementById("dDate").textContent = d.toLocaleString(undefined, { day: "numeric", month: "long", year: "numeric" });
    document.getElementById("dNote").value = state.notes[dateIso] || "";
    renderDrawerHabits();
    renderDrawerArt();
    updateDrawerMeta();
    document.getElementById("drawer").classList.add("show");
    document.getElementById("drawer").setAttribute("aria-hidden", "false");
    document.getElementById("scrim").classList.add("show");
  }

  function commitNote(dateIso, val) {
    if (val && val.trim()) state.notes[dateIso] = val;
    else delete state.notes[dateIso];
    save();
  }

  function closeDrawer() {
    if (openDate) {
      clearTimeout(noteTimer);
      commitNote(openDate, document.getElementById("dNote").value);
    }
    openDate = null;
    document.getElementById("drawer").classList.remove("show");
    document.getElementById("drawer").setAttribute("aria-hidden", "true");
    document.getElementById("scrim").classList.remove("show");
    render();
  }

  function renderDrawerHabits() {
    var hostHost = document.getElementById("dHabits");
    hostHost.innerHTML = "";
    if (!state.habits.length) { hostHost.appendChild(el("div", "empty", "No habits yet.")); return; }
    state.habits.forEach(function (h) {
      var isP = pendingPop && pendingPop.habit === h.id && pendingPop.date === openDate;
      if (h.type === "count") {
        var v = countValue(openDate, h);
        var done = v >= h.target;
        var rowC = el("div", "d-habit count-row" + (done ? " done" : ""));
        rowC.style.setProperty("--c", h.color);
        rowC.dataset.habit = h.id;
        rowC.innerHTML =
          '<span class="swatch" style="background:' + h.color + '"></span>' +
          '<span class="n">' + esc(h.name) + "<em>" + v + " / " + h.target + "</em></span>" +
          '<span class="stepper">' +
            '<button type="button" data-dec="1" aria-label="Decrease">−</button>' +
            "<b>" + v + "</b>" +
            '<button type="button" data-inc="1" aria-label="Increase">+</button>' +
          "</span>";
        hostHost.appendChild(rowC);
        return;
      }
      var done2 = isHabitDone(h, openDate);
      var row = el("div", "d-habit" + (done2 ? " done" : ""));
      row.style.setProperty("--c", h.color);
      row.dataset.habit = h.id;
      row.innerHTML =
        '<span class="swatch" style="background:' + h.color + '"></span>' +
        '<span class="n">' + esc(h.name) + "</span>" +
        '<span class="chk"></span>';
      hostHost.appendChild(row);
      if (isP) row.querySelector(".chk").classList.add("pop");
    });
  }

  function updateDrawerMeta() {
    var total = state.habits.length, done = 0;
    state.habits.forEach(function (h) { if (isHabitDone(h, openDate)) done++; });
    var meta = done + " of " + total + " done";
    if (total && done === total) meta += " · perfect";
    if (state.notes[openDate]) meta += " · note";
    document.getElementById("dMeta").textContent = meta;
  }

  document.getElementById("dHabits").addEventListener("click", function (e) {
    var row = e.target.closest("[data-habit]");
    if (!row || !openDate) return;
    var h = getHabit(row.dataset.habit);
    if (!h) return;
    if (e.target.closest("[data-inc]")) { stepCount(openDate, h, 1); save(); render(); return; }
    if (e.target.closest("[data-dec]")) { stepCount(openDate, h, -1); save(); render(); return; }
    if (h.type === "count") return;
    toggle(h.id, openDate);
  });

  var noteTimer = null;
  document.getElementById("dNote").addEventListener("input", function () {
    if (!openDate) return;
    var val = this.value;
    var dateIso = openDate;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(function () {
      if (val.trim()) state.notes[dateIso] = val;
      else delete state.notes[dateIso];
      save();
      render();
      if (openDate === dateIso) updateDrawerMeta();
    }, 350);
  });

  document.getElementById("dClear").addEventListener("click", function () {
    if (!openDate) return;
    delete state.notes[openDate];
    document.getElementById("dNote").value = "";
    save();
    render();
    updateDrawerMeta();
  });

  document.getElementById("drawerClose").addEventListener("click", closeDrawer);
  document.getElementById("scrim").addEventListener("click", closeDrawer);

  /* ---------- events ---------- */
  document.getElementById("calendar").addEventListener("click", function (e) {
    if (state.page === 2) return;
    var b = e.target.closest("[data-habit]");
    if (b) { toggle(b.dataset.habit, b.dataset.date); return; }
    var day = e.target.closest("[data-day]");
    if (day) openDrawer(day.dataset.day);
  });

  document.getElementById("habitList").addEventListener("click", function (e) {
    var del = e.target.closest("[data-del]");
    if (!del) return;
    var id = del.dataset.del;
    var h = state.habits.filter(function (x) { return x.id === id; })[0];
    if (!h) return;
    if (!confirm("Remove the “" + h.name + "” habit and its history?")) return;
    state.habits = state.habits.filter(function (x) { return x.id !== id; });
    Object.keys(state.log).forEach(function (k) {
      state.log[k] = state.log[k].filter(function (x) { return x !== id; });
      if (!state.log[k].length) delete state.log[k];
    });
    save();
    render();
  });

  document.getElementById("viewToggle").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b || b.dataset.view === state.view) return;
    state.view = b.dataset.view;
    save();
    render();
  });

  document.getElementById("pageToggle").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    var p = Number(b.dataset.page);
    if (p === state.page) return;
    flushWrites();
    state.page = p;
    state.view = "month";
    save();
    render();
  });

  document.getElementById("linesToggle").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    var n = Number(b.dataset.lines);
    if (n === state.lines) return;
    flushWrites();
    state.lines = n;
    save();
    render();
  });

  var writeTimer = null;
  function flushWrites() {
    if (writeTimer) { clearTimeout(writeTimer); writeTimer = null; }
    save();
  }
  document.getElementById("calendar").addEventListener("input", function (e) {
    var ta = e.target.closest("[data-write]");
    if (!ta) return;
    state.writing[ta.dataset.write] = ta.value;
    clearTimeout(writeTimer);
    writeTimer = setTimeout(function () { writeTimer = null; save(); }, 320);
  });
  document.getElementById("calendar").addEventListener("change", function (e) {
    var ta = e.target.closest("[data-write]");
    if (!ta) return;
    state.writing[ta.dataset.write] = ta.value;
    flushWrites();
  });

  document.getElementById("themeToggle").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b || b.dataset.theme === state.theme) return;
    state.theme = b.dataset.theme;
    save();
    render();
  });

  function step(dir) {
    var a = fromISO(state.anchor);
    if (state.view === "month") a.setMonth(a.getMonth() + dir);
    else a.setDate(a.getDate() + dir * 7);
    state.anchor = iso(a);
    save();
    render();
  }
  document.getElementById("prev").addEventListener("click", function () { step(-1); });
  document.getElementById("next").addEventListener("click", function () { step(1); });
  document.getElementById("today").addEventListener("click", function () {
    state.anchor = iso(new Date());
    save();
    render();
  });

  /* add form */
  var addForm = document.getElementById("addForm");
  var nameInput = document.getElementById("habitName");
  var paletteHost = document.getElementById("palette");

  function buildPalette() {
    paletteHost.innerHTML = "";
    PALETTE.forEach(function (c) {
      var b = el("button", c === addColor ? "sel" : "");
      b.type = "button";
      b.style.background = c;
      b.style.color = c;
      b.dataset.color = c;
      paletteHost.appendChild(b);
    });
  }

  document.getElementById("addToggle").addEventListener("click", function () {
    addForm.classList.toggle("open");
    if (addForm.classList.contains("open")) nameInput.focus();
  });

  var typeToggle = document.getElementById("typeToggle");
  var targetRow = document.getElementById("targetRow");
  var targetInput = document.getElementById("habitTarget");
  typeToggle.addEventListener("click", function (e) {
    var b = e.target.closest("[data-type]");
    if (!b) return;
    addType = b.dataset.type;
    Array.prototype.forEach.call(typeToggle.children, function (x) {
      x.classList.toggle("active", x === b);
    });
    targetRow.style.display = addType === "count" ? "flex" : "none";
    if (addType === "count") targetInput.focus();
  });

  paletteHost.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    addColor = b.dataset.color;
    buildPalette();
  });

  addForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var name = nameInput.value.trim();
    if (!name) { nameInput.focus(); return; }
    var h = { id: uid(), name: name, color: addColor };
    if (addType === "count") {
      h.type = "count";
      h.target = Math.max(1, Math.min(999, Math.round(Number(targetInput.value) || 1)));
    } else {
      h.type = "check";
      h.target = 1;
    }
    state.habits.push(h);
    addColor = PALETTE[state.habits.length % PALETTE.length];
    nameInput.value = "";
    buildPalette();
    save();
    render();
    nameInput.focus();
  });

  /* artwork: toggle, size, custom images */
  document.getElementById("artBtn").addEventListener("click", function () {
    state.artOn = !state.artOn;
    save();
    render();
  });

  var sizeRange = document.getElementById("sizeRange");
  sizeRange.value = state.daySize;
  sizeRange.addEventListener("input", function () {
    state.daySize = Number(this.value);
    applySize();
  });
  sizeRange.addEventListener("change", function () { save(); });

  var imgFile = document.getElementById("imgFile");
  document.getElementById("imgBtn").addEventListener("click", function () { imgFile.click(); });
  imgFile.addEventListener("change", function () {
    var f = this.files && this.files[0];
    this.value = "";
    if (!f) return;
    readImage(f, function (uri) {
      if (!uri) { alert("Sorry, that image couldn't be read."); return; }
      var prev = state.customArt;
      state.customArt = uri;
      if (!save()) {
        state.customArt = prev;
        save();
        alert("That image is too large to store in this browser. Try a smaller one.");
        return;
      }
      if (!state.artOn) { state.artOn = true; }
      render();
    });
  });
  document.getElementById("imgClear").addEventListener("click", function () {
    state.customArt = null;
    save();
    render();
  });

  var dArtFile = document.getElementById("dArtFile");
  document.getElementById("dArtPick").addEventListener("click", function () { if (openDate) dArtFile.click(); });
  dArtFile.addEventListener("change", function () {
    var f = this.files && this.files[0];
    this.value = "";
    if (!f || !openDate) return;
    var date = openDate;
    readImage(f, function (uri) {
      if (!uri) { alert("Sorry, that image couldn't be read."); return; }
      var prev = state.images[date];
      state.images[date] = uri;
      if (!save()) {
        if (prev === undefined) delete state.images[date]; else state.images[date] = prev;
        save();
        alert("That image is too large to store in this browser. Try a smaller one.");
        return;
      }
      if (!state.artOn) state.artOn = true;
      render();
    });
  });
  document.getElementById("dArtClear").addEventListener("click", function () {
    if (!openDate) return;
    delete state.images[openDate];
    save();
    renderDrawerArt();
    render();
  });

  /* export / import */
  document.getElementById("exportBtn").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "minical-" + iso(new Date()) + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  });

  document.getElementById("importBtn").addEventListener("click", function () {
    document.getElementById("importFile").click();
  });

  document.getElementById("importFile").addEventListener("change", function () {
    var file = this.files && this.files[0];
    this.value = "";
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var s = JSON.parse(reader.result);
        if (!s || !Array.isArray(s.habits)) throw new Error("bad");
        state = normalize(s);
        save();
        render();
        closeDrawer();
      } catch (err) {
        alert("That file doesn't look like a MINICAL backup.");
      }
    };
    reader.readAsText(file);
  });

  /* full screen */
  var fsBtn = document.getElementById("fsBtn");
  var fsEl = document.documentElement;
  var supportsFs = !!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen);
  if (!supportsFs) fsBtn.style.display = "none";
  function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function toggleFs() {
    if (isFs()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl);
  }
  function onFsChange() {
    fsBtn.classList.toggle("on", isFs());
    fsBtn.title = (isFs() ? "Exit full screen" : "Full screen") + " (F)";
  }
  fsBtn.addEventListener("click", toggleFs);
  document.addEventListener("fullscreenchange", onFsChange);
  document.addEventListener("webkitfullscreenchange", onFsChange);

  /* keyboard */
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && openDate) { closeDrawer(); return; }
    var tag = (e.target.tagName || "").toUpperCase();
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "ArrowRight") step(1);
    else if (e.key === "m" || e.key === "M") { state.view = "month"; save(); render(); }
    else if (e.key === "w" || e.key === "W") { state.view = "week"; save(); render(); }
    else if (e.key === "d" || e.key === "D") { state.theme = "day"; save(); render(); }
    else if (e.key === "n" || e.key === "N") { state.theme = "night"; save(); render(); }
    else if (e.key === "a" || e.key === "A") { state.theme = "auto"; save(); render(); }
    else if (e.key === "f" || e.key === "F") { if (supportsFs) toggleFs(); }
    else if (e.key === "t" || e.key === "T") { state.anchor = iso(new Date()); save(); render(); }
    else if (e.key === "1") { state.page = 1; state.view = "month"; save(); render(); }
    else if (e.key === "2") { state.page = 2; state.view = "month"; save(); render(); }
  });

  /* follow the system theme live while in Auto */
  if (mq) {
    var onScheme = function () { if (state.theme === "auto") applyTheme(); };
    if (mq.addEventListener) mq.addEventListener("change", onScheme);
    else if (mq.addListener) mq.addListener(onScheme);
  }

  /* app icon shows today */
  (function () {
    var t = new Date();
    document.getElementById("aiDow").textContent = WEEKDAYS[(t.getDay() + 6) % 7].slice(0, 3);
    document.getElementById("aiDay").textContent = String(t.getDate());
  })();

  /* go */
  buildPalette();
  render();
})();
</script>
</body>
</html>
